services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: namaa_tts
    volumes:
      - namaa_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d namaa_tts"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  namaa_pgdata:
