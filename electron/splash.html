<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>صوتك</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
        background: #0c0b0a;
        color: #f4f1ec;
        -webkit-user-select: none;
        -webkit-app-region: drag;
      }
      .mark { width: 64px; height: 64px; border-radius: 15px; }
      h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }
      #status { margin: 0; font-size: 13px; color: #a39c91; min-height: 20px; text-align: center; padding: 0 28px; }
      .track { width: 240px; height: 3px; border-radius: 999px; background: #29251f; overflow: hidden; }
      .bar { width: 38%; height: 100%; border-radius: 999px; background: #e5ab48; animation: slide 1.4s ease-in-out infinite; }
      /* Indeterminate: the boot has no measurable fraction, and a fake
         percentage during a multi-minute weights download would mislead. */
      @keyframes slide {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(360%); }
      }
      .hint { font-size: 11px; color: #6f675c; }
    </style>
  </head>
  <body>
    <img class="mark" src="../build/icon.png" alt="">
    <h1>صوتك</h1>
    <div class="track"><div class="bar"></div></div>
    <p id="status">بنجهّز كل حاجة...</p>
    <p class="hint">أول مرة ممكن تاخد شوية — بننزّل النموذج</p>
    <script>
      window.bootStatus?.onStatus((message) => {
        document.getElementById('status').textContent = message;
      });
    </script>
  </body>
</html>
